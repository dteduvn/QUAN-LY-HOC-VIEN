<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D&T Academy · Quản lý trung tâm</title>
<style>
:root{
  --yellow:#FCE79A; --yellow-soft:#FFF7D6; --yellow-deep:#E9C440;
  --ink:#2B2A26; --muted:#6F6A5E; --line:#ECE5CF; --bg:#FFFCF2;
  --green:#2E8B57; --green-soft:#E5F4EA; --red:#C0392B; --red-soft:#FBE9E7; --blue:#2D6CDF; --orange:#D9822B; --orange-soft:#FFF0E0;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h2.page{font-size:20px;margin:4px 0 12px}
h3.sec{font-size:15px;margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 24px;width:100%;max-width:360px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--yellow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.brand h1{font-size:17px;margin:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}

/* form bits */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--yellow-deep);box-shadow:0 0 0 3px var(--yellow-soft)}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;justify-content:center}
.btn:hover{background:var(--yellow-soft)}
.btn.primary{background:var(--yellow);border-color:var(--yellow-deep)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#F0C9C4}
.btn.danger.solid{background:var(--red);color:#fff}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:none;color:var(--blue);padding:0;font-size:13px}
.err{color:var(--red);font-size:13px;min-height:18px;margin:4px 0 10px}
.muted{color:var(--muted)} .small{font-size:12.5px}

/* layout */
header{background:var(--yellow);position:sticky;top:0;z-index:6}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;max-width:1150px;margin:0 auto}
.hbar .brand-mark{background:#fff}
.user{font-size:12px;text-align:right}.user .link{color:var(--ink);text-decoration:underline}
nav.tabs{display:flex;gap:4px;max-width:1150px;margin:0 auto;padding:0 12px}
nav.tabs button{border:none;background:none;padding:9px 13px 11px;font-weight:700;color:#6b5d22;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
nav.tabs button.on{color:var(--ink);border-color:var(--ink)}
nav.tabs .badge{background:var(--orange);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}
main{max-width:1150px;margin:0 auto;padding:16px 14px 90px}
@media(max-width:720px){
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom);justify-content:space-around;z-index:8}
  nav.tabs button{flex-direction:column;gap:2px;font-size:11px;padding:7px 4px 8px;border-bottom:none;border-top:3px solid transparent;flex:1}
  nav.tabs button.on{border-top-color:var(--yellow-deep)}
  nav.tabs .ico{font-size:19px}
  .hbar{padding:8px 12px}
}
@media(min-width:721px){ nav.tabs .ico{font-size:15px} }

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px;text-align:left}
.tile b{display:block;font-size:23px;line-height:1.15}.tile span{font-size:12px;color:var(--muted)}
.tile.warn b{color:var(--orange)} .tile.click{cursor:pointer}
@media(max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{opacity:.65;font-weight:500;margin-left:3px}

/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.sess{display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--yellow-deep)}
.sess.done{border-left-color:var(--green)} .sess.off{border-left-color:#bbb;opacity:.6}
.sess-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sess h4{margin:0;font-size:17px}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--yellow-soft);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--green-soft);color:var(--green);border-color:#BFE3CB}
.pill.off{background:#eee;color:#777}
.pill.mk{background:#E8F1FF;color:var(--blue);border-color:#C6DAFB}
.pill.warn{background:var(--orange-soft);color:var(--orange);border-color:#F6D5B0}
.pill.red{background:var(--red-soft);color:var(--red);border-color:#F0C9C4}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:30px 10px;background:#fff;border:1px dashed var(--line);border-radius:14px}
.banner{background:var(--orange-soft);border:1px solid #F6D5B0;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.banner.demo{background:#E8F1FF;border-color:#C6DAFB}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.datebar b{font-size:18px;min-width:170px;text-align:center}

/* table */
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:700;background:#FCFAF3;position:sticky;top:0;z-index:1}
tbody tr:hover{background:#FFFBEA}
tr.click{cursor:pointer}
tr.inactive td{color:#aaa}
td.num,th.num{text-align:right}
.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.minibar{display:inline-flex;align-items:center;gap:6px}
.minibar .bar{width:70px;height:7px;background:#F1EDE0;border-radius:99px;overflow:hidden}
.minibar .bar i{display:block;height:100%;background:var(--green)}
.minibar.full .bar i{background:var(--orange)}
.minibar.over .bar i{background:var(--red)}
.qinp{width:56px;border:1px solid var(--yellow-deep);border-radius:6px;padding:3px 5px;text-align:center;background:var(--yellow-soft)}
tfoot td{font-weight:700;background:#FCFAF3}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,35,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
@media(min-width:640px){.modal{border-radius:18px}}
.modal.wide{max-width:880px}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .sub{margin:0 0 14px;color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.grid2 .full{grid-column:1/-1}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.mfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;position:sticky;bottom:-18px;background:#fff;padding:10px 0 4px}
.mfoot .right{display:flex;gap:8px;margin-left:auto}
.att-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.att-row .nm{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-shrink:0}
.seg button{border:none;background:#fff;padding:6px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.P{background:var(--green);color:#fff}
.seg button.on.AP{background:var(--orange);color:#fff}
.seg button.on.A{background:var(--red);color:#fff}
.sched{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:6px}
.sched label{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:7px 4px;font-weight:700;font-size:13px}
.sched label.on{background:var(--yellow-soft);border-color:var(--yellow-deep)}
.sched input[type=time]{width:100%;border:1px solid var(--line);border-radius:6px;padding:3px;font-size:12px}
.list-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.drop{display:block;border:2px dashed var(--yellow-deep);border-radius:14px;padding:22px 14px;text-align:center;background:var(--yellow-soft);cursor:pointer}
.file-block{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden}
.file-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--yellow-soft);flex-wrap:wrap}
.file-body{max-height:220px;overflow:auto}
.file-body td{white-space:normal}
.msgbox{background:#F7F5EE;border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre-wrap;font-size:13.5px;line-height:1.5}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;text-align:center}

.subtabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:700}
.subtabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
tr.void td{color:#aaa;text-decoration:line-through}
tr.cur td{background:#FFFBEA}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 14px;font-size:13.5px;margin-bottom:12px}
.kv div span{display:block;color:var(--muted);font-size:12px}
.lock{background:#EEF2F7;border:1px solid #D5DEEA;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.log td{white-space:normal;font-size:13px}
@media(max-width:720px){ nav.tabs button{font-size:10.5px;padding:7px 2px 8px} }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login" hidden>
  <form class="login-card" id="loginForm">
    <div class="brand" style="margin-bottom:18px"><div class="brand-mark">D&amp;T</div><div><h1>D&amp;T Academy</h1><p>Hệ thống quản lý trung tâm</p></div></div>
    <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label>Mật khẩu</label><input id="loginPass" type="password" autocomplete="current-password" required></div>
    <div class="err" id="loginErr"></div>
    <button class="btn primary" style="width:100%" type="submit">Đăng nhập</button>
    <p style="text-align:center;margin:12px 0 0"><button type="button" class="link" id="forgotBtn">Quên mật khẩu?</button></p>
  </form>
</div>

<!-- ===== APP ===== -->
<div id="app" hidden>
  <header>
    <div class="hbar">
      <div class="brand"><div class="brand-mark">D&amp;T</div><div><h1>D&amp;T Academy</h1><p>Quản lý trung tâm</p></div></div>
      <div class="user"><div id="userEmail"></div><button class="link" id="logoutBtn">Đăng xuất</button></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="on"><span class="ico">📅</span>Hôm nay</button>
      <button data-tab="students"><span class="ico">👧</span>Học viên</button>
      <button data-tab="fees"><span class="ico">💰</span>Học phí <span class="badge" id="feeBadge" hidden></span></button>
      <button data-tab="classes"><span class="ico">🏫</span>Lớp &amp; lịch</button>
      <button data-tab="payroll"><span class="ico">🧾</span>Chấm công</button>
      <button data-tab="settings"><span class="ico">⚙️</span>Cài đặt</button>
    </nav>
  </header>
  <main>
    <div id="banner"></div>
    <section id="tab-today"></section>
    <section id="tab-students" hidden></section>
    <section id="tab-fees" hidden></section>
    <section id="tab-classes" hidden></section>
    <section id="tab-payroll" hidden></section>
    <section id="tab-settings" hidden></section>
  </main>
</div>

<div class="overlay" id="modal" hidden><div class="modal" id="modalBox"></div></div>
<div class="overlay" id="modal2" hidden><div class="modal" id="modal2Box" style="max-width:420px"></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileInput" accept=".xlsx,.xls" multiple hidden>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script type="module">
/* =====================================================================
   D&T ACADEMY · QUẢN LÝ TRUNG TÂM · BẢN 3
   Nguyên tắc: số buổi & khóa học KHÔNG lưu cứng mà luôn được TÍNH LẠI từ
   (lịch học + buổi bù − buổi nghỉ) và (phiếu thu). Sửa một buổi trong quá
   khứ thì mọi khóa, công nợ, chấm công tự cập nhật đúng.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAqCMHVsE7pLmcP-iTjOh0F_GW2v4U8X20",
  authDomain: "dt-academy-tracker.firebaseapp.com",
  projectId: "dt-academy-tracker",
  storageBucket: "dt-academy-tracker.firebasestorage.app",
  messagingSenderId: "118306441305",
  appId: "1:118306441305:web:906735a9c0a830a8214948"
};
const PACK = 12;
const DEFAULT_STAFF = [{name:'Cô Dung',rate:0},{name:'Cô Thủy',rate:130000}];
const DEFAULT_TEACHER = name => /\b(3|7)\b/.test(String(name)) ? 'Cô Thủy' : 'Cô Dung';
const ADMINS = ['dtedu.vn@gmail.com'];   // phải khớp với Firestore Rules
// Lịch học 2026 (T2=1 … T7=6, CN=0) – tự áp dụng cho lớp chưa có lịch
const DEFAULT_SCHEDULE = {
  'Lớp 1':[{dow:6,time:'14:30'},{dow:0,time:'14:30'}],
  'Lớp 2':[{dow:6,time:'09:30'},{dow:0,time:'09:30'}],
  'Lớp 3':[{dow:2,time:'17:00'},{dow:3,time:'14:00'},{dow:6,time:'08:00'}],
  'Lớp 4':[{dow:3,time:'16:00'},{dow:6,time:'16:00'},{dow:0,time:'16:00'}],
  'Lớp 5':[{dow:2,time:'18:00'},{dow:6,time:'18:00'},{dow:0,time:'18:00'}],
  'Lớp 6':[{dow:1,time:'18:00'},{dow:3,time:'18:00'},{dow:5,time:'18:00'}],
  'Lớp 7':[{dow:2,time:'18:30'},{dow:4,time:'17:00'},{dow:6,time:'09:30'}],
};
const SCHEDULE_FROM = '2026-11-01';
const DEMO = new URLSearchParams(location.search).has('demo');
const SDK = "https://www.gstatic.com/firebasejs/12.14.0/";

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(Number(n)||0).toLocaleString('vi-VN') + 'đ';
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/\s+/g,' ').trim();
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const todayISO = () => iso(new Date());
const DOW = ['CN','T2','T3','T4','T5','T6','T7'], DOW_ORDER=[1,2,3,4,5,6,0];
const dmy = s => s ? s.split('-').reverse().join('/') : '';
const dm = s => s ? dmy(s).slice(0,5) : '';
const dayLabel = s => { const d=parseISO(s); return `${DOW[d.getDay()]}, ${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`; };
const givenName = s => String(s||'').trim().split(/\s+/).pop();
const vnSort = (a,b) => givenName(a).localeCompare(givenName(b),'vi') || String(a).localeCompare(String(b),'vi');
const monthOf = s => String(s||'').slice(0,7);
const mLabel = m => m.split('-').reverse().join('/');
const num = v => Number(String(v??'').replace(/\D/g,''))||0;

function toast(msg, ms=2600){ const t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(t._h); t._h=setTimeout(()=>t.hidden=true, ms); }
function cleanPhone(v){ let p=String(v??'').replace(/\D/g,''); if(p.startsWith('84')&&p.length===11) p='0'+p.slice(2); if(p.length===9&&!p.startsWith('0')) p='0'+p; return p; }
function cleanDob(v){
  if(v===null||v===undefined||v==='') return '';
  if(typeof v==='number' && window.XLSX){ const d=XLSX.SSF.parse_date_code(v); if(d) return `${pad(d.d)}/${pad(d.m)}/${d.y}`; }
  let s=String(v).trim().replace(/[.\-\s]+/g,'/');
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)||s.match(/^(\d{1,2})\/(\d{1,2})(\d{4})$/);
  return m ? `${pad(m[1])}/${pad(m[2])}/${m[3]}` : s;
}
function warnings(st){
  const w=[]; const m=String(st.dob||'').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if(st.dob && !m) w.push('Ngày sinh sai định dạng');
  else if(m){ const age=new Date().getFullYear()-(+m[3]); if(+m[1]>31||+m[2]>12) w.push('Ngày sinh không hợp lệ'); else if(age<3||age>70) w.push('Kiểm tra năm sinh'); }
  if(st.phone && st.phone.length!==10) w.push('SĐT không đủ 10 số');
  if(!st.phone) w.push('Chưa có SĐT');
  return w;
}
async function copyText(t){ try{ await navigator.clipboard.writeText(t); }catch{ const a=document.createElement('textarea'); a.value=t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } toast('Đã sao chép ✔'); }
function xlsxDownload(sheets, filename){ const wb=XLSX.utils.book_new(); for(const [name,rows] of sheets){ const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'(trống)':''}]); const keys=Object.keys(rows[0]||{}); ws['!cols']=keys.map(k=>({wch:Math.min(40,Math.max(8,k.length+2,...rows.slice(0,200).map(r=>String(r[k]??'').length+1)))})); XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31)); } XLSX.writeFile(wb,filename); }

/* modal */
function openModal(html, wide=false){ $('modalBox').className='modal'+(wide?' wide':''); $('modalBox').innerHTML=html; $('modal').hidden=false; return $('modalBox'); }
function closeModal(){ $('modal').hidden=true; }
['modal','modal2'].forEach(id=>$(id).addEventListener('click',e=>{ if(e.target.id===id || e.target.closest('[data-close]')) $(id).hidden=true; }));
function confirmDialog(title, html, ok='Đồng ý', danger=false, withReason=false){
  return new Promise(res=>{
    $('modal2Box').innerHTML=`<h2>${esc(title)}</h2><p style="line-height:1.5">${html}</p>${withReason?'<div class="field"><label>Lý do (bắt buộc)</label><input id="cdReason"></div>':''}<div class="mfoot"><div class="right"><button class="btn" data-x="no">Hủy</button><button class="btn ${danger?'danger solid':'primary'}" data-x="yes">${esc(ok)}</button></div></div>`;
    $('modal2').hidden=false;
    $('modal2Box').onclick=e=>{ const x=e.target.dataset.x; if(!x) return;

async function firebaseStore(){
  const { initializeApp } = await import(SDK+"firebase-app.js");
  const A = await import(SDK+"firebase-auth.js");
  const F = await import(SDK+"firebase-firestore.js");
  const app=initializeApp(firebaseConfig), auth=A.getAuth(app), db=F.getFirestore(app); const unsubs=[];
  return {
    onAuth: cb=>A.onAuthStateChanged(auth,cb), login:(e,p)=>A.signInWithEmailAndPassword(auth,e,p), logout:()=>A.signOut(auth), reset:e=>A.sendPasswordResetEmail(auth,e),
    watch(col,cb,onErr){ unsubs.push(F.onSnapshot(F.collection(db,col), s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), onErr)); },
    watchWhere(col,field,val,cb,onErr){ const u=F.onSnapshot(F.query(F.collection(db,col),F.where(field,'==',val)), s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))), onErr); unsubs.push(u); return u; },
    watchDoc(col,id,cb,onErr){ const u=F.onSnapshot(F.doc(db,col,id), d=>cb(d.exists()?{id:d.id,...d.data()}:null), onErr); unsubs.push(u); return u; },
    put:(col,id,data)=>F.setDoc(F.doc(db,col,id),data),
    stop(){ unsubs.splice(0).forEach(u=>u()); },
    async add(col,data){ return (await F.addDoc(F.collection(db,col),{...data,createdAt:F.serverTimestamp()})).id; },
    set:(col,id,data)=>F.setDoc(F.doc(db,col,id),{...data,updatedAt:F.serverTimestamp()},{merge:true}),
    update:(col,id,data)=>F.updateDoc(F.doc(db,col,id),{...data,updatedAt:F.serverTimestamp()}),
    del:(col,id)=>F.deleteDoc(F.doc(db,col,id)),
    async batchUpdate(col,items){ for(let i=0;i<items.length;i+=400){ const b=F.writeBatch(db); items.slice(i,i+400).forEach(([id,d])=>b.update(F.doc(db,col,id),d)); await b.commit(); } },
    async addMany(col,list){ for(let i=0;i<list.length;i+=400){ const b=F.writeBatch(db); list.slice(i,i+400).forEach(d=>b.set(F.doc(F.collection(db,col)),{...d,createdAt:F.serverTimestamp()})); await b.commit(); } },
    async recent(col,n){ const q=F.query(F.collection(db,col),F.orderBy('at','desc'),F.limit(n)); return (await F.getDocs(q)).docs.map(d=>({id:d.id,...d.data()})); },
    async reserveCodes(n){ const ref=F.doc(db,'meta','counters');
      const start=await F.runTransaction(db,async tx=>{ const s=await tx.get(ref); const cur=s.exists()?(s.data().student||0):0; tx.set(ref,{student:cur+n},{merge:true}); return cur+1; });
      return Array.from({length:n},(_,i)=>'HS'+String(start+i).padStart(3,'0')); },
  };
}

let sessMap=new Map(), mkIdx=new Map(), classSessCache=new Map(), ledgerCache=new Map(), EARLIEST=todayISO();
function slotsOn(cls,date){ const h=(cls.schedules||[]).filter(x=>x.from<=date).sort((a,b)=>a.from<b.from?1:-1)[0]; if(!h) return []; const d=parseISO(date).getDay(); return (h.slots||[]).filter(s=>s.dow===d); }
function holidayOn(date){ return settings().holidays.find(h=>h.from<=date && date<=(h.to||h.from)); }
function sessionsOnDay(cls,date){
  const out=[];
  for(const s of slotsOn(cls,date)){ const id=sessId(cls.id,date,s.time), doc=sessMap.get(id), hol=holidayOn(date);
    out.push({id,classId:cls.id,date,time:s.time,type:'regular',doc,status:doc?.status||(hol?'cancelled':'scheduled'),reason:doc?.reason||(hol&&!doc?(hol.reason||'Nghỉ lễ'):'')}); }
  for(const doc of mkIdx.get(cls.id+'|'+date)||[]) out.push({id:doc.id,classId:cls.id,date,time:doc.time,type:'makeup',doc,status:doc.status||'scheduled',reason:doc.reason||''});
  return out.sort((a,b)=>String(a.time).localeCompare(String(b.time)));
}
/* Mọi buổi được TÍNH (không nghỉ) của một lớp, từ EARLIEST đến hôm nay */
function classSessions(cid){
  if(classSessCache.has(cid)) return classSessCache.get(cid);
  const cls=classById(cid), out=[], end=todayISO();
  if(cls) for(let d=EARLIEST; d<=end; d=addDays(d,1)) for(const s of sessionsOnDay(cls,d)) if(s.status!=='cancelled') out.push(s);
  classSessCache.set(cid,out); return out;
}
const teacherOf = s => s.doc?.teacher || classById(s.classId)?.teacher || '(chưa gán)';

/* =====================================================================
   SỔ KHÓA HỌC (LEDGER) — tính lại hoàn toàn từ dữ liệu gốc
   ===================================================================== */
function periodsOf(st){ return st.periods?.length ? st.periods : [{classId:st.classId, from:addDays(st.opening?.date||todayISO(),1)}]; }
function paymentsOf(sid){ return S.payments.filter(p=>p.studentId===sid && !p.legacy).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.no||'').localeCompare(String(b.no||''))); }
function ledger(st){
  if(ledgerCache.has(st.id)) return ledgerCache.get(st.id);
  const real=[];
  for(const p of periodsOf(st)) for(const s of classSessions(p.classId)) if(s.date>=p.from && (!p.to||s.date<=p.to)) real.push(s);
  real.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const base=Math.max(0,(st.opening?.used||0)+(st.adjust||0));
  const n=base+real.length;
  // phiếu thu → các "suất" khóa đã trả, theo thứ tự thời gian
  const slots=[]; if(st.opening?.paid) slots.push({type:'opening'});
  for(const p of paymentsOf(st.id)) if(p.status!=='void') for(let k=0;k<(p.packs||1);k++) slots.push({type:'pay',pay:p,share:(Number(p.amount)||0)/(p.packs||1)});
  const P=slots.length, nextPack=Math.floor(n/PACK)+1;
  const totalPacks=Math.max(Math.ceil(n/PACK),P,1);
  const courses=[];
  for(let i=1;i<=totalPacks;i++){
    const lo=(i-1)*PACK, hi=i*PACK, virt=Math.max(0,Math.min(hi,base)-lo), sess=real.slice(Math.max(0,lo-base),Math.max(0,hi-base));
    const consumed=Math.max(0,Math.min(hi,n)-lo);
    const att={P:0,AP:0,A:0,none:0}; sess.forEach(s=>{ const v=s.doc?.attendance?.[st.id]; att[v in att?v:'none']++; });
    courses.push({no:i, virt, sess, consumed, start:sess[0]?.date||'', end:consumed>=PACK?(sess[sess.length-1]?.date||''):'',
      status: consumed>=PACK?'done':consumed>0?'running':'future', paid:slots[i-1]||null, att});
  }
  const cur = n>0 && n%PACK===0 ? {no:n/PACK,used:PACK} : {no:Math.floor(n/PACK)+1,used:n%PACK};
  const r={n,base,real,P,nextPack,due:P<nextPack,owedSessions:Math.max(0,n-PACK*P),owedPacks:Math.max(0,nextPack-P),cur,courses,prepaid:Math.max(0,P-nextPack)};
  ledgerCache.set(st.id,r); return r;
}
const dueList = () => active().filter(s=>ledger(s).due).sort((a,b)=>ledger(b).owedSessions-ledger(a).owedSessions||vnSort(a.name,b.name));

/* ---------------- HỌC VIÊN ---------------- */
function packCell(st){
  const L=ledger(st), u=L.cur.used, cls=L.due&&L.owedSessions>0?'over':u>=PACK?'full':'';
  return `<span class="minibar ${cls}"><span class="bar"><i style="width:${u/PACK*100}%"></i></span><b>${u}/${PACK}</b></span> <span class="muted small">K${L.cur.no}</span>`;
}
function statusPills(st){
  const L=ledger(st), out=[];
  if(st.status==='inactive') out.push('<span class="pill off">Đã nghỉ</span>');
  if(L.owedSessions>0) out.push(`<span class="pill red">Nợ ${L.owedSessions} buổi</span>`);
  else if(L.due && st.status!=='inactive') out.push('<span class="pill warn">Cần thu khóa mới</span>');
  if(L.prepaid) out.push(`<span class="pill ok">Đã đóng trước ${L.prepaid} khóa</span>`);
  return out.join(' ');
}

        const periods=periodsOf(s).map(p=>({...p})), last=periods[periods.length-1], changes=[];
        if(data.classId!==s.classId && data.status==='active'){ if(!last.to) last.to=t; periods.push({classId:data.classId,from:addDays(t,1)}); changes.push(`chuyển ${classById(s.classId)?.name} → ${classById(data.classId)?.name}`); }
        if(data.status==='inactive' && s.status!=='inactive'){ const l=periods[periods.length-1]; if(!l.to) l.to=t; data.leftDate=t; changes.push('cho nghỉ học'); }
        if(data.status==='active' && s.status==='inactive'){ periods.push({classId:data.classId,from:addDays(t,1)}); data.leftDate=''; changes.push('học lại'); }
        data.periods=periods;
        if(data.fee!==s.fee) changes.push(`học phí ${money(s.fee)} → ${money(data.fee)}`);
        await store.update('students',id,data); log('Sửa học viên',`${s.code} ${data.name}${changes.length?': '+changes.join(', '):''}`);
      } else {
        const dup=S.students.find(x=>norm(x.name)===norm(data.name)&&x.classId===data.classId);
        if(dup && !await confirmDialog('Trùng tên',`Lớp này đã có “${esc(dup.name)}” (${esc(dup.code)}). Vẫn thêm?`,'Vẫn thêm')) return;
        const mode=$('fPaid').value, used=Math.max(0,Math.min(PACK,Number($('fUsed').value)||0));
        const [code]=await store.reserveCodes(1);
        const sid=await store.add('students',{...data,code,opening:{date:t,used,paid:mode==='old'},adjust:0,periods:[{classId:data.classId,from:addDays(t,1)}]});
        log('Thêm học viên',`${code} ${data.name} – ${classById(data.classId)?.name}`);
        if(mode==='pay'){ closeModal(); return payModal({...data,id:sid,code,opening:{date:t,used,paid:false},adjust:0,periods:[{classId:data.classId,from:addDays(t,1)}]}); }
      }
      closeModal(); toast('Đã lưu ✔');
    }catch(err){ showError(err); }
  };
  if(id) box.querySelector('#fDel').onclick=async()=>{
    if(paymentsOf(id).length) return toast('Học viên đã có phiếu thu nên không xóa được. Hãy chuyển trạng thái sang “Đã nghỉ học”.',4500);
    if(await confirmDialog('Xóa học viên?',`Xóa vĩnh viễn ${esc(s.name)} (${esc(s.code)}). Nên dùng “Đã nghỉ học” để giữ lịch sử.`,'Xóa vĩnh viễn',true)){
      try{ await store.del('students',id); log('Xóa học viên',`${s.code} ${s.name}`); closeModal(); toast('Đã xóa'); }catch(err){ showError(err); } }
  };
}

function importModal(){

    <div class="mfoot"><span class="muted small" id="impSum"></span><div class="right"><button class="btn" data-close>Đóng</button><button class="btn primary" id="impGo" disabled>Nhập</button></div></div>`,true);

$('fileInput').addEventListener('change',e=>handleFiles(e.target.files));
const mode=arr=>{ const m={}; let best=null; arr.filter(Boolean).forEach(v=>{ m[v]=(m[v]||0)+1; if(!best||m[v]>m[best]) best=v; }); return best; };
function guessClassName(fn,title){ const t=String(title||'').match(/Lớp:\s*([^.…\s][^…]*?)\s{2,}/); if(t&&t[1].trim()) return t[1].trim(); const f=fn.normalize('NFC').match(/L[ỚO]?[_\s-]*P[_\s-]*(\d+)/i)||fn.match(/(\d+)/); return f?'Lớp '+f[1]:fn.replace(/\.\w+$/,''); }
async function handleFiles(files){
  for(const file of files){ try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const sh=wb.SheetNames.find(n=>/danh s[áa]ch/i.test(n))||wb.SheetNames[0];
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1,raw:true,defval:null});
    const hi=aoa.findIndex(r=>r.some(c=>/họ\s*(và)?\s*tên/i.test(String(c||'')))); if(hi<0){ toast(`${file.name}: không thấy cột “Họ và tên”`); continue; }
    const H=aoa[hi].map(norm), col=k=>H.findIndex(h=>h.includes(k));
    const C={name:col('ho va ten'),dob:col('ngay sinh'),gender:col('gioi tinh'),phone:col('dien thoai'),addr:col('dia chi'),level:col('cap do'),start:col('nhap hoc'),fee:col('hoc phi'),note:col('ghi chu')};
    const g=(r,k)=>C[k]>=0?r[C[k]]:null, rows=[];
    for(const r of aoa.slice(hi+1)){ if(r.some(c=>/tổng số/i.test(String(c||'')))) break; const name=String(g(r,'name')||'').replace(/\s+/g,' ').trim(); if(!name) continue;
      rows.push({name,dob:cleanDob(g(r,'dob')),gender:String(g(r,'gender')||'').trim(),phone:cleanPhone(g(r,'phone')),address:String(g(r,'addr')||'').trim(),level:String(g(r,'level')||'').trim(),
        startDate:cleanDob(g(r,'start')),fee:num(g(r,'fee')),note:String(g(r,'note')||'').trim(),status:'active'}); }
    const cn=guessClassName(file.name,aoa.slice(0,hi).flat().find(c=>/Lớp:/.test(String(c||'')))), ex=S.classes.find(c=>norm(c.name)===norm(cn));
    parsed.push({file:file.name,className:cn,classId:ex?.id||'__new',rows,fee:mode(rows.map(r=>r.fee))||500000,level:mode(rows.map(r=>r.level))||''});
  }catch(err){ console.error(err); toast('Không đọc được '+file.name); } }
  renderImport();
}
function renderImport(){
  parsed.sort((a,b)=>a.className.localeCompare(b.className,'vi',{numeric:true})); let total=0,dups=0;
  $('impPrev').innerHTML=parsed.map((p,pi)=>{ p.rows.forEach(r=>r._dup=p.classId!=='__new'&&S.students.some(s=>s.classId===p.classId&&norm(s.name)===norm(r.name)));
    const ok=p.rows.filter(r=>!r._dup).length; total+=ok; dups+=p.rows.length-ok;
    return `<div class="file-block"><div class="file-head"><b>📄 ${esc(p.file)}</b><span>Vào lớp: <select data-pi="${pi}" class="inp" style="width:auto;padding:4px 8px"><option value="__new" ${p.classId==='__new'?'selected':''}>＋ Tạo lớp “${esc(p.className)}”</option>${sortedClasses().map(c=>`<option value="${c.id}" ${c.id===p.classId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></span>
      <span class="muted small">${ok} mới${p.rows.length-ok?` · bỏ qua ${p.rows.length-ok} đã có`:''}</span></div><div class="file-body"><table><tr><th>#</th><th>Họ tên</th><th>Ngày sinh</th><th>SĐT</th><th>Học phí</th><th>Lưu ý</th></tr>
      ${p.rows.map((r,i)=>`<tr><td>${i+1}</td><td style="${r._dup?'text-decoration:line-through;color:#999':''}">${esc(r.name)}</td><td>${esc(r.dob)}</td><td>${esc(r.phone)}</td><td>${money(r.fee)}</td><td>${r._dup?'Đã có':warnings(r).map(x=>`<span class="pill warn">${esc(x)}</span>`).join(' ')}</td></tr>`).join('')}</table></div></div>`; }).join('');
  $('impSum').textContent=parsed.length?`Sẽ nhập ${total} học viên${dups?`, bỏ qua ${dups} đã có`:''}.`:''; $('impGo').disabled=!total; $('impGo').textContent=`Nhập ${total} học viên`;
}
async function doImport(){
  $('impGo').disabled=true; $('impGo').textContent='Đang nhập…'; const t=todayISO();
  try{ let n=0;
    for(const p of parsed){ let cid=p.classId;
      if(cid==='__new'){ const ex=S.classes.find(c=>norm(c.name)===norm(p.className));
        cid=ex?.id||await store.add('classes',{name:p.className,fee:p.fee,level:p.level,teacher:DEFAULT_TEACHER(p.className),order:Number((p.className.match(/\d+/)||[99])[0]),schedules:[]});
        if(!ex&&!classById(cid)) S.classes.push({id:cid,name:p.className}); }
      const list=p.rows.filter(r=>!r._dup).map(({_dup,...r})=>({...r,classId:cid,fee:r.fee||p.fee,opening:{date:t,used:0,paid:true},adjust:0,periods:[{classId:cid,from:addDays(t,1)}]}));
      if(list.length){ const codes=await store.reserveCodes(list.length); await store.addMany('students',list.map((r,i)=>({...r,code:codes[i]}))); n+=list.length; } }
    log('Nhập Excel',`${n} học viên`); closeModal(); toast(`Đã nhập ${n} học viên ✔`,3500);
  }catch(err){ showError(err); $('impGo').disabled=false; $('impGo').textContent='Thử lại'; }
}

  }

}

function curSched(c){ return (c.schedules||[]).filter(x=>x.from<=todayISO()).sort((a,b)=>a.from<b.from?1:-1)[0]||[...(c.schedules||[])].sort((a,b)=>a.from<b.from?-1:1)[0]; }
function schedText(c){ const h=curSched(c); if(!h||!h.slots?.length) return '<span class="pill warn">Chưa có lịch học</span>';
  const fut=(c.schedules||[]).filter(x=>x.from>todayISO()); return [...h.slots].sort((a,b)=>DOW_ORDER.indexOf(a.dow)-DOW_ORDER.indexOf(b.dow)).map(s=>`<span class="pill">${DOW[s.dow]} ${esc(s.time)}</span>`).join(' ')+(fut.length?` <span class="small muted">· lịch mới từ ${dmy(fut[0].from)}</span>`:''); }

    <div class="cards">${sortedClasses().map(c=>{ const n=active().filter(s=>s.classId===c.id).length;

      const off=S.sessions.filter(s=>s.classId===c.id&&s.status==='cancelled'&&s.date>=addDays(t,-30)).sort((a,b)=>a.date.localeCompare(b.date));

        <div>${schedText(c)}</div>
        ${mk.length?`<div class="small"><b>Buổi bù (30 ngày):</b> ${mk.map(s=>`<span class="pill mk">${dm(s.date)} ${esc(s.time)}</span>`).join(' ')}</div>`:''}
        ${off.length?`<div class="small"><b>Đã nghỉ (30 ngày):</b> ${off.map(s=>`<span class="pill off">${dm(s.date)}</span>`).join(' ')}</div>`:''}
        <div class="row-actions"><button class="btn sm" data-mk="${c.id}">＋ Buổi bù</button><button class="btn sm" data-off="${c.id}">🚫 Nghỉ 1 buổi</button><button class="btn sm" data-pstart="${c.id}">📍 Ngày bắt đầu khóa</button></div></div>`; }).join('')||'<div class="empty">Chưa có lớp nào.</div>'}</div>
    <h3 class="sec">Ngày nghỉ lễ toàn trung tâm</h3>
    <div class="card">${st.holidays.length?[...st.holidays].sort((a,b)=>b.from.localeCompare(a.from)).map(h=>`<div class="list-line"><span><b>${esc(h.reason||'Nghỉ lễ')}</b> · ${dmy(h.from)}${h.to&&h.to!==h.from?' → '+dmy(h.to):''}</span><button class="btn sm danger" data-delhol="${esc(h.from)}|${esc(h.to||'')}">Xóa</button></div>`).join(''):'<p class="muted small" style="margin:0">Chưa có. Các buổi rơi vào ngày nghỉ lễ sẽ tự không tính vào khóa.</p>'}</div>`;

$('tab-classes').addEventListener('click',async e=>{

  if(b.dataset.act==='newclass') classModal();

      try{ await store.set('meta','settings',{holidays:settings().holidays.filter(h=>!(h.from===f&&(h.to||'')===t))}); log('Xóa ngày nghỉ lễ',`${dmy(f)}${t&&t!==f?' → '+dmy(t):''}`); }catch(err){ showError(err); } }

function classModal(id){
  const c=id?classById(id):{name:'',fee:500000,level:'',teacher:settings().staff[0]?.name||'',schedules:[]};
  const cur=[...(c.schedules||[])].sort((a,b)=>a.from<b.from?1:-1)[0], slot=d=>cur?.slots?.find(s=>s.dow===d), staff=settings().staff;
  const minFrom=settings().lockedUntil?addDays(settings().lockedUntil,1):'';
  const box=openModal(`<h2>${id?'Sửa lớp':'Thêm lớp'}</h2><p class="sub">Lịch học dùng để tự đếm buổi trong khóa ${PACK} buổi.</p>
    <div class="grid2"><div class="field"><label>Tên lớp</label><input id="kName" value="${esc(c.name)}"></div>
    <div class="field"><label>Giáo viên phụ trách</label><select id="kT">${staff.map(p=>`<option ${p.name===c.teacher?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Học phí / khóa ${PACK} buổi</label><input id="kFee" inputmode="numeric" value="${esc(c.fee)}"></div>
    <div class="field"><label>Cấp độ</label><input id="kLevel" value="${esc(c.level||'')}"></div></div>
    <div class="field"><label>Lịch học trong tuần (tick ngày học, chọn giờ)</label></div>
    <div class="sched" id="kS">${DOW_ORDER.map(d=>`<label class="${slot(d)?'on':''}"><span><input type="checkbox" data-d="${d}" ${slot(d)?'checked':''}> ${DOW[d]}</span><input type="time" data-t="${d}" value="${esc(slot(d)?.time||'17:30')}"></label>`).join('')}</div>
    <div class="field" style="max-width:260px"><label>Lịch này áp dụng từ ngày</label><input type="date" id="kFrom" min="${minFrom}" value="${cur?.from&&cur.from>todayISO()?cur.from:todayISO()}"></div>
    <p class="muted small">Các buổi trước ngày áp dụng vẫn tính theo lịch cũ. Muốn tính các buổi đã học từ trước thì chọn ngày bắt đầu khóa học trong quá khứ.</p>
    ${(c.schedules||[]).length>1?`<details class="small"><summary>Lịch sử thay đổi lịch</summary>${[...c.schedules].sort((a,b)=>a.from<b.from?1:-1).map(h=>`<div class="list-line"><span>Từ ${dmy(h.from)}</span><span>${h.slots.map(s=>DOW[s.dow]+' '+s.time).join(', ')||'không có buổi'}</span></div>`).join('')}</details>`:''}
    <div class="mfoot">${id?'<button class="btn danger" id="kDel">Xóa lớp</button>':''}<div class="right"><button class="btn" data-close>Hủy</button><button class="btn primary" id="kOk">Lưu</button></div></div>`);
  box.querySelector('#kS').onchange=e=>{ if(e.target.dataset.d) e.target.closest('label').classList.toggle('on',e.target.checked); };
  box.querySelector('#kOk').onclick=async()=>{
    const slots=DOW_ORDER.filter(d=>box.querySelector(`[data-d="${d}"]`).checked).map(d=>({dow:d,time:box.querySelector(`[data-t="${d}"]`).value||'17:30'}));
    const from=$('kFrom').value||todayISO(); let schedules=[...(c.schedules||[])];
    const changed=JSON.stringify(cur?.slots||[])!==JSON.stringify(slots);
    if(changed){ if(guard(from)) return; schedules=schedules.filter(h=>h.from!==from); schedules.push({from,slots}); }
    const data={name:$('kName').value.trim()||'Lớp mới',teacher:$('kT').value,fee:num($('kFee').value),level:$('kLevel').value.trim(),schedules};
    try{ if(id) await store.update('classes',id,data); else await store.add('classes',{...data,order:Number((data.name.match(/\d+/)||[99])[0])});
      log(id?'Sửa lớp':'Thêm lớp',`${data.name} · GV ${data.teacher} · ${money(data.fee)}${changed?` · lịch từ ${dmy(from)}: ${slots.map(s=>DOW[s.dow]+' '+s.time).join(', ')||'trống'}`:''}`);
      closeModal(); toast('Đã lưu lớp ✔'); }catch(err){ showError(err); }
  };
  if(id) box.querySelector('#kDel').onclick=async()=>{ const n=S.students.filter(s=>periodsOf(s).some(p=>p.classId===id)).length;
    if(n) return toast(`Lớp có ${n} học viên (kể cả lịch sử) nên không xóa được`,4000);
    if(await confirmDialog('Xóa lớp?',`Xóa ${esc(c.name)}.`,'Xóa',true)) try{ await store.del('classes',id); log('Xóa lớp',c.name); closeModal(); }catch(err){ showError(err); } };
}
/* Đặt ngày bắt đầu khóa hiện tại cho cả lớp (dùng khi bắt đầu dùng hệ thống) */
function packStartModal(cid){
  const c=classById(cid), studs=active().filter(s=>s.classId===cid).sort((a,b)=>vnSort(a.name,b.name));
  const box=openModal(`<h2>Ngày bắt đầu khóa hiện tại · ${esc(c.name)}</h2>

    <div class="grid2"><div class="field"><label>Buổi đầu tiên của khóa hiện tại</label><input type="date" id="psD" value="${todayISO()}"></div>
    <div class="field"><label>Khóa này đã đóng tiền?</label><select id="psPaid"><option value="1">Đã đóng</option><option value="0">Chưa đóng</option></select></div></div>
    <div id="psPrev" class="small muted" style="margin-bottom:8px"></div>

    <div class="mfoot"><div class="right"><button class="btn" data-close>Hủy</button><button class="btn primary" id="psOk">Áp dụng</button></div></div>`);
  const prev=()=>{ const d=$('psD').value; if(!d) return; const n=countFrom(c,d); $('psPrev').innerHTML=`Từ ${dmy(d)} đến hôm nay lớp đã học <b>${n} buổi</b> theo lịch → mỗi em đang ở <b>${Math.min(n,PACK)}/${PACK}</b>${n>PACK?` (đã sang khóa mới ${n-PACK} buổi)`:''}.`; };
  $('psD').onchange=prev; prev();
  box.querySelector('#psOk').onclick=async()=>{ const d=$('psD').value; if(!d) return toast('Chọn ngày'); if(guard(d)) return;
    const ids=[...box.querySelectorAll('[data-ps]:checked')].map(x=>x.dataset.ps); if(!ids.length) return toast('Chưa chọn học viên');

    if(withPay.length && !await confirmDialog('Có học viên đã có phiếu thu',`${withPay.length} học viên đã có phiếu thu trong hệ thống. Đặt lại ngày bắt đầu có thể làm lệch sổ khóa của các em. Vẫn áp dụng?`,'Vẫn áp dụng',true)) return;
    try{ await store.batchUpdate('students',ids.map(id=>[id,{opening:{date:addDays(d,-1),used:0,paid:$('psPaid').value==='1'},adjust:0,periods:[{classId:cid,from:d}]}]));
      log('Đặt ngày bắt đầu khóa',`${c.name}: ${ids.length} HV từ ${dmy(d)} (${$('psPaid').value==='1'?'đã đóng':'chưa đóng'})`); closeModal(); toast('Đã áp dụng ✔'); }catch(err){ showError(err); } };
}

function payrollRows(m){
  const first=m+'-01', last=iso(new Date(+m.slice(0,4),+m.slice(5,7),0)), upto=last<todayISO()?last:todayISO(), rows=[];
  for(const c of sortedClasses()) for(let d=first; d<=upto; d=addDays(d,1)) for(const s of sessionsOnDay(c,d)) if(s.status!=='cancelled') rows.push({...s,cls:c.name,teacher:teacherOf(s)});
  return {rows:rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)),upto,last};
}

  const m=S.prMonth, pr=payrollRows(m), rows=isAdmin()?pr.rows:pr.rows.filter(r=>r.teacher===S.myName), {upto,last}=pr, staff=settings().staff, rate=n=>staff.find(p=>p.name===n)?.rate||0;
  const by={}; rows.forEach(r=>(by[r.teacher]??=[]).push(r));
  const months=[]; for(let i=0;i<12;i++){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); months.push(iso(d).slice(0,7)); }
  const unmarked=rows.filter(r=>!r.doc?.attendance).length;
  $('tab-payroll').innerHTML=`<div class="toolbar"><h2 class="page" style="margin:0;flex:1">Chấm công</h2>
      <select id="prMonth" class="inp" style="width:auto">${months.map(x=>`<option value="${x}" ${x===m?'selected':''}>Tháng ${mLabel(x)}</option>`).join('')}</select><button class="btn" data-act="xpr">📤 Xuất Excel</button></div>
    <p class="muted small">Tự tính từ lịch học + buổi bù, trừ buổi nghỉ${upto<last?`, tính đến hết hôm nay (${dmy(upto)})`:''}. Giáo viên của từng buổi lấy theo điểm danh, chưa điểm danh thì lấy giáo viên phụ trách lớp.${unmarked?` <b>${unmarked} buổi chưa điểm danh</b> nên chưa xác nhận được ai dạy.`:''}</p>
    <div class="tiles">${Object.entries(by).map(([t,l])=>`<div class="tile"><b>${l.length} ca</b><span>${esc(t)}${rate(t)?` · <b style="display:inline;font-size:13px;color:var(--ink)">${money(l.length*rate(t))}</b>`:''}</span></div>`).join('')||'<div class="tile"><b>0</b><span>Chưa có ca dạy</span></div>'}</div>
    ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Ngày</th><th>Giờ</th><th>Lớp</th><th>Giáo viên</th><th>Loại</th><th>Điểm danh</th><th>Nội dung</th><th class="num">Tiền ca</th></tr></thead><tbody>
      ${rows.map(r=>{ const a=r.doc?.attendance; return `<tr><td>${dayLabel(r.date)}</td><td>${esc(r.time)}</td><td>${esc(r.cls)}</td><td>${esc(r.teacher)}</td><td>${r.type==='makeup'?'<span class="pill mk">Bù</span>':'Lịch'}</td>

      </tbody></table></div>`:'<div class="empty">Chưa có ca dạy nào trong tháng này (kiểm tra lịch học các lớp).</div>'}`;
}

/* =====================================================================
   BOOT + NÂNG CẤP DỮ LIỆU TỪ BẢN TRƯỚC

function showError(err){ console.error(err);
  if(String(err?.code||err).includes('permission-denied')){ $('banner').innerHTML+=`<div class="banner"><b>Firestore chưa cho phép thao tác này.</b> Vào Firebase → Firestore → Rules và cập nhật luật mới (có <code>logs</code>).</div>`; toast('Chưa có quyền (permission-denied)',4000); }
  else toast('Lỗi: '+(err?.message||err),4000); }
const authMsg=c=>({'auth/invalid-credential':'Sai email hoặc mật khẩu','auth/too-many-requests':'Thử sai quá nhiều lần, đợi vài phút','auth/operation-not-allowed':'Chưa bật đăng nhập Email/Password','auth/unauthorized-domain':'Tên miền chưa được thêm vào Authorized domains'}[c]||c);
$('loginForm').addEventListener('submit',async e=>{ e.preventDefault(); $('loginErr').textContent=''; try{ await store.login($('loginEmail').value.trim(),$('loginPass').value); }catch(err){ $('loginErr').textContent=authMsg(err.code); } });
$('forgotBtn').addEventListener('click',async()=>{ const e=$('loginEmail').value.trim(); if(!e) return $('loginErr').textContent='Nhập email trước'; try{ await store.reset(e); $('loginErr').style.color='var(--green)'; $('loginErr').textContent='Đã gửi email đặt lại mật khẩu'; }catch(err){ $('loginErr').textContent=authMsg(err.code); } });
$('logoutBtn').addEventListener('click',()=>store.logout());

const loaded={}; let upgraded=false;
async function upgrade(){
  if(upgraded || !isAdmin() || !['students','classes','payments','meta'].every(k=>loaded[k])) return; upgraded=true;
  try{
    const t=todayISO();
    // 1) học viên từ bản 1–2 → sổ khóa học
    const need=S.students.filter(s=>!s.opening);
    if(need.length){ await store.batchUpdate('students',need.map(s=>{ const d=s.baseDate||t; const per={classId:s.classId,from:addDays(d,1)}; if(s.status==='inactive') per.to=s.leftDate||t;
      return [s.id,{opening:{date:d,used:Math.max(0,s.baseUsed??s.sessionsUsed??0),paid:true},adjust:0,periods:[per]}]; })); log('Nâng cấp dữ liệu',`${need.length} học viên sang sổ khóa học`); }
    // 2) phiếu thu của bản 2 đã được tính vào mốc cũ → đánh dấu bản cũ
    const old=S.payments.filter(p=>p.prev && !p.legacy); for(const p of old) await store.update('payments',p.id,{legacy:true});
    // 3) giáo viên mặc định
    if(!S.meta.settings?.staff) await store.set('meta','settings',{staff:DEFAULT_STAFF});
    for(const c of S.classes.filter(c=>!c.teacher||/part-time|^Delilah$/i.test(c.teacher))) await store.update('classes',c.id,{teacher:DEFAULT_TEACHER(c.name)});
    // 4) lịch học 2026 cho lớp chưa có lịch
    for(const c of S.classes){ const k=Object.keys(DEFAULT_SCHEDULE).find(n=>norm(n)===norm(c.name));
      if(k && !(c.schedules||[]).length){ await store.update('classes',c.id,{schedules:[{from:SCHEDULE_FROM,slots:DEFAULT_SCHEDULE[k]}]}); log('Nhập lịch học 2026',c.name); } }
  }catch(err){ upgraded=false; showError(err); }
}
/* Giáo viên: chỉ tải dữ liệu các lớp mình dạy (khớp với Firestore Rules) */
function teacherBoot(){
  const subs={}, B={cls:{},stu:{},ses:{}};
  const merge=()=>{ S.classes=Object.values(B.cls).filter(Boolean); const uniq=a=>[...new Map(a.map(x=>[x.id,x])).values()];
    S.students=uniq(Object.values(B.stu).flat()); S.sessions=uniq(Object.values(B.ses).flat()); later(); };
  store.watchDoc('meta','settings',d=>{ S.meta.settings=d||{}; S.myName=settings().teacherAccounts[S.user]||''; later(); },showError);
  store.watchDoc('meta','access',d=>{
    const ids=((d?.teacherClasses)||{})[S.user]||[];
    for(const id of Object.keys(subs)) if(!ids.includes(id)){ subs[id].forEach(u=>u&&u()); delete subs[id]; delete B.cls[id]; delete B.stu[id]; delete B.ses[id]; }
    for(const id of ids) if(!subs[id]) subs[id]=[
      store.watchDoc('classes',id,x=>{ B.cls[id]=x; merge(); },showError),
      store.watchWhere('students','classId',id,x=>{ B.stu[id]=x; merge(); },showError),
      store.watchWhere('sessions','classId',id,x=>{ B.ses[id]=x; merge(); },showError)];
    merge();
  },showError);
}
(async function boot(){
  try{ store=DEMO?demoStore():await firebaseStore(); }catch{ document.body.innerHTML='<p style="padding:20px">Không tải được Firebase. Kiểm tra mạng rồi tải lại trang.</p>'; return; }
  store.onAuth(user=>{
    if(user){ S.user=(user.email||'').toLowerCase(); $('login').hidden=true; $('app').hidden=false; $('userEmail').textContent=S.user;
      S.role = (DEMO && !new URLSearchParams(location.search).get('as')) || ADMINS.includes(S.user) ? 'admin' : 'teacher';
      if(S.role==='admin'){
        const w=(col,fn)=>store.watch(col,d=>{ fn(d); loaded[col]=true; upgrade(); later(); },showError);
        w('students',d=>S.students=d); w('classes',d=>S.classes=d); w('sessions',d=>S.sessions=d); w('payments',d=>S.payments=d); w('meta',d=>S.meta=Object.fromEntries(d.map(x=>[x.id,x])));
      } else teacherBoot();
    } else { store.stop(); $('app').hidden=true; $('login').hidden=false; }
  });
})();
